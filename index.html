<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contractor Command Center</title>
  <meta name="theme-color" content="#1976d2" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <style>
    body { margin: 0; font-family: 'Roboto', sans-serif; background: #f5f7fb; }
    #root { min-height: 100vh; }
    .app-shell { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .table-scroll { overflow-x: auto; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@mui/material@5.15.14/umd/material-ui.development.js" crossorigin></script>
  <script src="https://unpkg.com/@emotion/react@11.11.4/dist/emotion-react.umd.min.js" crossorigin></script>
  <script src="https://unpkg.com/@emotion/styled@11.11.5/dist/emotion-styled.umd.min.js" crossorigin></script>
  <script src="https://unpkg.com/dexie@4.0.8/dist/dexie.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const {
      AppBar, Toolbar, Typography, Container, Box, Paper, Grid, TextField, Button,
      Card, CardContent, CardHeader, Stack, Divider, Table, TableBody, TableCell,
      TableContainer, TableHead, TableRow, IconButton, Dialog, DialogTitle, DialogContent,
      DialogActions, Snackbar, Alert, Chip, Switch, FormControlLabel
    } = MaterialUI;

    // Dexie schema models relationships via projectId on estimate items
    const db = new Dexie('ContractorCommandDexie');
    db.version(1).stores({
      projects: '&id,name,clientName,status,createdAt,updatedAt,brandName,brandEmail,brandPhone,brandAddress,markup,tax,discount,closed',
      estimateItems: '&id,projectId,phase,task,description,type,quantity,unitCost'
    });

    const generateId = () => `${Date.now().toString(36)}-${Math.random().toString(36).substring(2, 8)}`;

    const currency = (value = 0) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(Number(value) || 0);

    const ProjectForm = ({ onSave }) => {
      const [name, setName] = useState('');
      const [clientName, setClientName] = useState('');

      const handleSubmit = () => {
        if (!name) return;
        onSave({ name, clientName });
        setName('');
        setClientName('');
      };

      return (
        <Paper sx={{ p: 2 }}>
          <Stack spacing={2}>
            <Typography variant="h6">Start New Estimate</Typography>
            <TextField label="Project / Estimate Name" value={name} onChange={(e) => setName(e.target.value)} fullWidth />
            <TextField label="Client Name" value={clientName} onChange={(e) => setClientName(e.target.value)} fullWidth />
            <Button variant="contained" onClick={handleSubmit}>Create Estimate</Button>
          </Stack>
        </Paper>
      );
    };

    const ItemDialog = ({ open, onClose, onSave, initial }) => {
      const [phase, setPhase] = useState(initial?.phase || 'General');
      const [task, setTask] = useState(initial?.task || '');
      const [description, setDescription] = useState(initial?.description || '');
      const [type, setType] = useState(initial?.type || 'Labor');
      const [quantity, setQuantity] = useState(initial?.quantity || 1);
      const [unitCost, setUnitCost] = useState(initial?.unitCost || 0);

      useEffect(() => {
        setPhase(initial?.phase || 'General');
        setTask(initial?.task || '');
        setDescription(initial?.description || '');
        setType(initial?.type || 'Labor');
        setQuantity(initial?.quantity || 1);
        setUnitCost(initial?.unitCost || 0);
      }, [initial, open]);

      const handleSave = () => {
        onSave({ phase, task, description, type, quantity: Number(quantity), unitCost: Number(unitCost) });
      };

      return (
        <Dialog open={open} onClose={onClose} fullWidth>
          <DialogTitle>{initial ? 'Edit Line Item' : 'Add Line Item'}</DialogTitle>
          <DialogContent>
            <Stack spacing={2} sx={{ mt: 1 }}>
              <TextField label="Phase" value={phase} onChange={(e) => setPhase(e.target.value)} fullWidth />
              <TextField label="Task" value={task} onChange={(e) => setTask(e.target.value)} fullWidth />
              <TextField label="Description" value={description} onChange={(e) => setDescription(e.target.value)} fullWidth multiline rows={2} />
              <TextField label="Type (Labor/Material)" value={type} onChange={(e) => setType(e.target.value)} fullWidth />
              <TextField label="Quantity" type="number" value={quantity} onChange={(e) => setQuantity(e.target.value)} fullWidth />
              <TextField label="Unit Cost" type="number" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} fullWidth />
            </Stack>
          </DialogContent>
          <DialogActions>
            <Button onClick={onClose}>Cancel</Button>
            <Button variant="contained" onClick={handleSave}>{initial ? 'Update' : 'Add'}</Button>
          </DialogActions>
        </Dialog>
      );
    };

    const EstimateTable = ({ items, onEdit, onDelete, locked }) => (
      <TableContainer component={Paper} className="table-scroll">
        <Table size="small">
          <TableHead>
            <TableRow>
              <TableCell>Phase</TableCell>
              <TableCell>Task</TableCell>
              <TableCell>Description</TableCell>
              <TableCell>Type</TableCell>
              <TableCell align="right">Qty</TableCell>
              <TableCell align="right">Unit Cost</TableCell>
              <TableCell align="right">Line Total</TableCell>
              <TableCell align="center">Actions</TableCell>
            </TableRow>
          </TableHead>
          <TableBody>
            {items.length === 0 && (
              <TableRow>
                <TableCell colSpan={8} align="center">No items yet. Add tasks to build the estimate.</TableCell>
              </TableRow>
            )}
            {items.map((item) => (
              <TableRow key={item.id} hover>
                <TableCell>{item.phase}</TableCell>
                <TableCell>{item.task}</TableCell>
                <TableCell>{item.description}</TableCell>
                <TableCell>{item.type}</TableCell>
                <TableCell align="right">{item.quantity}</TableCell>
                <TableCell align="right">{currency(item.unitCost)}</TableCell>
                <TableCell align="right">{currency(item.quantity * item.unitCost)}</TableCell>
                <TableCell align="center">
                  <Stack direction="row" spacing={1} justifyContent="center">
                    <Button size="small" variant="outlined" disabled={locked} onClick={() => onEdit(item)}>Edit</Button>
                    <Button size="small" color="error" variant="text" disabled={locked} onClick={() => onDelete(item.id)}>Delete</Button>
                  </Stack>
                </TableCell>
              </TableRow>
            ))}
          </TableBody>
        </Table>
      </TableContainer>
    );

    const ProjectHeader = ({ project, onUpdateSettings }) => {
      const [brand, setBrand] = useState({
        brandName: project?.brandName || '',
        brandEmail: project?.brandEmail || '',
        brandPhone: project?.brandPhone || '',
        brandAddress: project?.brandAddress || ''
      });
      const [financials, setFinancials] = useState({
        tax: project?.tax ?? 0,
        discount: project?.discount ?? 0,
        markup: project?.markup ?? 0
      });

      useEffect(() => {
        setBrand({
          brandName: project?.brandName || '',
          brandEmail: project?.brandEmail || '',
          brandPhone: project?.brandPhone || '',
          brandAddress: project?.brandAddress || ''
        });
        setFinancials({
          tax: project?.tax ?? 0,
          discount: project?.discount ?? 0,
          markup: project?.markup ?? 0
        });
      }, [project]);

      const handleSave = () => {
        onUpdateSettings({ ...brand, ...financials });
      };

      return (
        <Card variant="outlined" sx={{ mb: 2 }}>
          <CardHeader title={project.name} subheader={project.clientName || 'Unassigned client'} action={
            <Chip label={project.closed ? 'Closed (read-only)' : 'Open for editing'} color={project.closed ? 'default' : 'success'} />
          } />
          <CardContent>
            <Grid container spacing={2}>
              <Grid item xs={12} md={6}>
                <Typography variant="subtitle2" gutterBottom>Branding (appears on PDF)</Typography>
                <Stack spacing={1}>
                  <TextField label="Business Name" value={brand.brandName} onChange={(e) => setBrand({ ...brand, brandName: e.target.value })} fullWidth />
                  <TextField label="Business Email" value={brand.brandEmail} onChange={(e) => setBrand({ ...brand, brandEmail: e.target.value })} fullWidth />
                  <TextField label="Business Phone" value={brand.brandPhone} onChange={(e) => setBrand({ ...brand, brandPhone: e.target.value })} fullWidth />
                  <TextField label="Business Address" value={brand.brandAddress} onChange={(e) => setBrand({ ...brand, brandAddress: e.target.value })} fullWidth multiline rows={2} />
                </Stack>
              </Grid>
              <Grid item xs={12} md={6}>
                <Typography variant="subtitle2" gutterBottom>Pricing Controls</Typography>
                <Stack spacing={1}>
                  <TextField label="Tax %" type="number" value={financials.tax} onChange={(e) => setFinancials({ ...financials, tax: e.target.value })} fullWidth />
                  <TextField label="Discount %" type="number" value={financials.discount} onChange={(e) => setFinancials({ ...financials, discount: e.target.value })} fullWidth />
                  <TextField label="Markup %" type="number" value={financials.markup} onChange={(e) => setFinancials({ ...financials, markup: e.target.value })} fullWidth />
                  <Button variant="contained" onClick={handleSave}>Save Branding & Pricing</Button>
                </Stack>
              </Grid>
            </Grid>
          </CardContent>
        </Card>
      );
    };

    const Totals = ({ items, project }) => {
      const subtotal = useMemo(() => items.reduce((sum, item) => sum + Number(item.quantity) * Number(item.unitCost), 0), [items]);
      const markupVal = subtotal * ((Number(project.markup) || 0) / 100);
      const discountVal = subtotal * ((Number(project.discount) || 0) / 100);
      const taxableBase = subtotal + markupVal - discountVal;
      const taxVal = taxableBase * ((Number(project.tax) || 0) / 100);
      const total = taxableBase + taxVal;

      return (
        <Paper sx={{ p: 2, mt: 2 }}>
          <Stack spacing={1}>
            <Typography variant="subtitle1">Summary</Typography>
            <Stack direction="row" justifyContent="space-between"><span>Subtotal</span><span>{currency(subtotal)}</span></Stack>
            <Stack direction="row" justifyContent="space-between"><span>Markup ({project.markup || 0}%)</span><span>{currency(markupVal)}</span></Stack>
            <Stack direction="row" justifyContent="space-between"><span>Discount ({project.discount || 0}%)</span><span>-{currency(discountVal)}</span></Stack>
            <Stack direction="row" justifyContent="space-between"><span>Tax ({project.tax || 0}%)</span><span>{currency(taxVal)}</span></Stack>
            <Divider />
            <Stack direction="row" justifyContent="space-between" sx={{ fontWeight: 700 }}><span>Total</span><span>{currency(total)}</span></Stack>
          </Stack>
        </Paper>
      );
    };

    const App = () => {
      const [projects, setProjects] = useState([]);
      const [activeProjectId, setActiveProjectId] = useState(null);
      const [items, setItems] = useState([]);
      const [dialogOpen, setDialogOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [snackbar, setSnackbar] = useState('');

      const activeProject = useMemo(() => projects.find((p) => p.id === activeProjectId) || null, [projects, activeProjectId]);

      const loadProjects = async () => {
        const data = await db.table('projects').toArray();
        setProjects(data.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)));
      };

      const loadItems = async (projectId) => {
        const data = await db.table('estimateItems').where('projectId').equals(projectId).toArray();
        setItems(data);
      };

      useEffect(() => {
        loadProjects();
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('service-worker.js');
        }
      }, []);

      useEffect(() => {
        if (activeProjectId) loadItems(activeProjectId);
      }, [activeProjectId]);

      const handleCreateProject = async ({ name, clientName }) => {
        const id = generateId();
        const project = {
          id,
          name,
          clientName,
          status: 'Estimating',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          brandName: '', brandEmail: '', brandPhone: '', brandAddress: '',
          tax: 0, discount: 0, markup: 0, closed: false
        };
        await db.table('projects').put(project);
        await loadProjects();
        setActiveProjectId(id);
        setSnackbar('Estimate started. Begin adding tasks.');
      };

      const handleSaveItem = async (payload) => {
        if (!activeProject) return;
        const record = editingItem ? { ...editingItem, ...payload } : { ...payload, id: generateId(), projectId: activeProject.id };
        await db.table('estimateItems').put(record);
        await loadItems(activeProject.id);
        setDialogOpen(false);
        setEditingItem(null);
        setSnackbar(editingItem ? 'Line item updated.' : 'Line item added.');
      };

      const handleDeleteItem = async (id) => {
        await db.table('estimateItems').delete(id);
        if (activeProject) await loadItems(activeProject.id);
        setSnackbar('Line item removed.');
      };

      const handleUpdateSettings = async (fields) => {
        if (!activeProject) return;
        const updated = { ...activeProject, ...fields, updatedAt: new Date().toISOString() };
        await db.table('projects').put(updated);
        await loadProjects();
        setSnackbar('Branding and pricing saved.');
      };

      const toggleClosed = async () => {
        if (!activeProject) return;
        const updated = { ...activeProject, closed: !activeProject.closed, updatedAt: new Date().toISOString() };
        await db.table('projects').put(updated);
        await loadProjects();
        setSnackbar(updated.closed ? 'Estimate closed. Editing locked.' : 'Estimate reopened. Editing enabled.');
      };

      const generatePdf = () => {
        if (!activeProject) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let y = 10;
        doc.setFontSize(16);
        doc.text(activeProject.brandName || 'Estimate', 10, y);
        y += 8;
        doc.setFontSize(11);
        doc.text(`Client: ${activeProject.clientName || 'N/A'}`, 10, y);
        y += 6;
        doc.text(`Project: ${activeProject.name}`, 10, y);
        y += 6;
        if (activeProject.brandEmail || activeProject.brandPhone) {
          doc.text(`Contact: ${activeProject.brandEmail || ''} ${activeProject.brandPhone || ''}`.trim(), 10, y);
          y += 6;
        }
        if (activeProject.brandAddress) {
          doc.text(activeProject.brandAddress, 10, y);
          y += 6;
        }
        y += 2;
        doc.setFontSize(13);
        doc.text('Estimate Items', 10, y);
        y += 6;
        doc.setFontSize(10);
        items.forEach((item) => {
          doc.text(`${item.phase} - ${item.task}: ${item.description}`, 10, y);
          doc.text(`${item.quantity} x ${currency(item.unitCost)} = ${currency(item.quantity * item.unitCost)}`, 12, y + 5);
          y += 12;
          if (y > 270) { doc.addPage(); y = 10; }
        });

        const subtotal = items.reduce((sum, i) => sum + i.quantity * i.unitCost, 0);
        const markupVal = subtotal * ((Number(activeProject.markup) || 0) / 100);
        const discountVal = subtotal * ((Number(activeProject.discount) || 0) / 100);
        const taxableBase = subtotal + markupVal - discountVal;
        const taxVal = taxableBase * ((Number(activeProject.tax) || 0) / 100);
        const total = taxableBase + taxVal;

        y += 4;
        doc.setFontSize(12);
        doc.text('Summary', 10, y);
        y += 6;
        doc.setFontSize(10);
        const rows = [
          ['Subtotal', currency(subtotal)],
          [`Markup (${activeProject.markup || 0}%)`, currency(markupVal)],
          [`Discount (${activeProject.discount || 0}%)`, `-${currency(discountVal)}`],
          [`Tax (${activeProject.tax || 0}%)`, currency(taxVal)],
          ['Total', currency(total)]
        ];
        rows.forEach(([label, val]) => {
          doc.text(label, 10, y);
          doc.text(val, 160, y, { align: 'right' });
          y += 6;
        });

        const url = doc.output('bloburl');
        window.open(url, '_blank');
      };

      return (
        <Box>
          <AppBar position="static" color="primary">
            <Toolbar>
              <Typography variant="h6" sx={{ flexGrow: 1 }}>Contractor Command Center</Typography>
              {activeProject && (
                <FormControlLabel
                  control={<Switch checked={!activeProject.closed} onChange={toggleClosed} color="secondary" />}
                  label={activeProject.closed ? 'Closed' : 'Editing Enabled'}
                />
              )}
            </Toolbar>
          </AppBar>
          <Container maxWidth="lg" className="app-shell">
            <Grid container spacing={2}>
              <Grid item xs={12} md={4}>
                <ProjectForm onSave={handleCreateProject} />
                <Paper sx={{ p: 2, mt: 2 }}>
                  <Typography variant="h6" gutterBottom>Estimates</Typography>
                  <Stack spacing={1}>
                    {projects.map((p) => (
                      <Button key={p.id} variant={p.id === activeProjectId ? 'contained' : 'outlined'} onClick={() => setActiveProjectId(p.id)} fullWidth>
                        <Stack direction="column" alignItems="flex-start">
                          <Typography variant="subtitle1">{p.name}</Typography>
                          <Typography variant="caption">{p.clientName || 'No client'} • {p.closed ? 'Closed' : 'Open'}</Typography>
                        </Stack>
                      </Button>
                    ))}
                    {projects.length === 0 && <Typography variant="body2" color="text.secondary">No estimates yet.</Typography>}
                  </Stack>
                </Paper>
              </Grid>
              <Grid item xs={12} md={8}>
                {activeProject ? (
                  <Box>
                    <ProjectHeader project={activeProject} onUpdateSettings={handleUpdateSettings} />
                    <Stack direction="row" spacing={1} sx={{ mb: 1 }}>
                      <Button variant="contained" onClick={() => setDialogOpen(true)} disabled={activeProject.closed}>Add Item</Button>
                      <Button variant="outlined" onClick={generatePdf}>Preview & Print PDF</Button>
                    </Stack>
                    <EstimateTable items={items} locked={activeProject.closed} onEdit={(item) => { setEditingItem(item); setDialogOpen(true); }} onDelete={handleDeleteItem} />
                    <Totals items={items} project={activeProject} />
                  </Box>
                ) : (
                  <Paper sx={{ p: 4 }}>
                    <Typography variant="h6">Select or create an estimate to get started.</Typography>
                  </Paper>
                )}
              </Grid>
            </Grid>
          </Container>
          <ItemDialog open={dialogOpen} onClose={() => { setDialogOpen(false); setEditingItem(null); }} onSave={handleSaveItem} initial={editingItem} />
          <Snackbar open={!!snackbar} autoHideDuration={3000} onClose={() => setSnackbar('')}>
            <Alert severity="success" variant="filled">{snackbar}</Alert>
          </Snackbar>
        </Box>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
